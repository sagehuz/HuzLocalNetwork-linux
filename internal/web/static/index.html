<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HuzLocalNetwork - LAN Monitor</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<header>
		<h1>HuzLocalNetwork <span class="subtitle">LAN Monitor &amp; Device Control</span></h1>
		<div id="conn-status" class="status-pill status-connecting">connecting…</div>
	</header>

	<main>
		<div class="table-wrap">
		<table id="devices-table">
			<thead>
				<tr>
					<th>Status</th>
					<th>IP Address</th>
					<th>MAC Address</th>
					<th>Vendor</th>
					<th>Name / Alias</th>
					<th>Type</th>
					<th>Model</th>
					<th>Services</th>
					<th>First Seen</th>
					<th>Last Seen</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="devices-body">
				<tr><td colspan="11" class="empty">Loading device list…</td></tr>
			</tbody>
		</table>
		</div>
	</main>

	<footer>
		<small>Auto Scan each 30 seconds · Realtime update via SSE</small>
	</footer>

	<script src="/static/app.js"></script>
</body>
</html>
